AWSTemplateFormatVersion: "2010-09-09"
Description: Schatzies Events - Core Infrastructure Stack

# ==============================================================
# PARAMETERS (secrets — passed at deploy via --parameter-overrides,
# never stored in this template/git)
# ==============================================================
Parameters:
  JwtSecret:
    Type: String
    NoEcho: true
    Description: JWT signing secret for the backend API.
  SmtpPass:
    Type: String
    NoEcho: true
    Description: SMTP password (Gmail app password) for outbound email.
  VapidPrivateKey:
    Type: String
    NoEcho: true
    Description: VAPID private key for web-push.

# ==============================================================
# RESOURCES
# ==============================================================
Resources:

  # --------------------------------------------------------------
  # S3: Deployment & Frontend Hosting
  # --------------------------------------------------------------
  SchatziesDeploymentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "schatzies-events-deployments-${AWS::AccountId}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: Schatzies
        - Key: Env
          Value: prod
        - Key: CostCenter
          Value: schatzies-client

  SchatziesDeploymentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SchatziesDeploymentBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SchatziesDeploymentBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SchatziesCloudFrontDistribution}"

  SchatziesGeneralBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "schatzies-general-bucket-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false
      Tags:
        - Key: Project
          Value: Schatzies
        - Key: Env
          Value: prod
        - Key: CostCenter
          Value: schatzies-client

  SchatziesGeneralBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SchatziesGeneralBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${SchatziesGeneralBucket.Arn}/*"

  # --------------------------------------------------------------
  # S3: Data Backup Bucket (Long-term archival)
  # --------------------------------------------------------------
  SchatziesBackupBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "schatzies-data-backups-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ArchiveOldBackups
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER
                TransitionInDays: 90
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: Schatzies
        - Key: Env
          Value: prod
        - Key: CostCenter
          Value: schatzies-client

  # --------------------------------------------------------------
  # CloudFront: CDN & Distribution
  # --------------------------------------------------------------
  SchatziesCloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "schatzies-oac-${AWS::StackName}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SchatziesCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - DomainName: !GetAtt SchatziesDeploymentBucket.RegionalDomainName
            Id: S3Origin
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt SchatziesCloudFrontOAC.Id
          - DomainName: !Sub "${SchatziesApi}.execute-api.${AWS::Region}.amazonaws.com"
            Id: ApiOrigin
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        Enabled: true
        DefaultRootObject: index.html
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          Compress: true
        CacheBehaviors:
          - PathPattern: "/api/*"
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
        CustomErrorResponses:
          - ErrorCode: 403
            ResponsePagePath: /index.html
            ResponseCode: 200
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponsePagePath: /index.html
            ResponseCode: 200
            ErrorCachingMinTTL: 0
        # Note: custom domain aliases and ACM certificate are configured
        # manually on the live CloudFront distribution outside of this template.
      Tags:
        - Key: Project
          Value: Schatzies
        - Key: Env
          Value: prod
        - Key: CostCenter
          Value: schatzies-client

  # --------------------------------------------------------------
  # DynamoDB: Single-Table Database
  # --------------------------------------------------------------
  SchatziesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: schatzies_main_table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: Schatzies
        - Key: Env
          Value: prod
        - Key: CostCenter
          Value: schatzies-client

  # --------------------------------------------------------------
  # IAM: Lambda Execution Role
  # --------------------------------------------------------------
  SchatziesLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: schatzies-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: schatzies-s3-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - !Sub "${SchatziesGeneralBucket.Arn}"
                  - !Sub "${SchatziesGeneralBucket.Arn}/*"
        - PolicyName: schatzies-backup-s3-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListObjectsV2
                  - s3:DeleteObject
                Resource:
                  - !Sub "${SchatziesBackupBucket.Arn}"
                  - !Sub "${SchatziesBackupBucket.Arn}/*"
        - PolicyName: schatzies-dynamodb-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt SchatziesTable.Arn
                  - !Sub "${SchatziesTable.Arn}/index/*"
      Tags:
        - Key: Project
          Value: Schatzies
        - Key: Env
          Value: prod
        - Key: CostCenter
          Value: schatzies-client

  # --------------------------------------------------------------
  # Lambda: Backend Function
  # --------------------------------------------------------------
  SchatziesLambdaBackend:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: schatzies-backend
      Runtime: nodejs24.x
      Handler: handler.handler
      Role: !GetAtt SchatziesLambdaExecutionRole.Arn
      Code:
        ZipFile: |
          export const handler = async (event) => {
            return {
              statusCode: 200,
              headers: {
                "Content-Type": "application/json",
                "Access-Control-Allow-Origin": "*"
              },
              body: JSON.stringify({ message: "schatzies-backend is running" })
            };
          };
      MemorySize: 128
      Timeout: 120
      Environment:
        Variables:
          API_GATEWAY_URL: !Sub "https://${SchatziesApi}.execute-api.${AWS::Region}.amazonaws.com"
          NODE_ENV: production
          FRONTEND_URL: https://www.schatziesevents.com
          AWS_DYNAMO_TABLE: !Ref SchatziesTable
          AWS_GENERAL_BUCKET: !Ref SchatziesGeneralBucket
          AWS_BACKUP_BUCKET: !Ref SchatziesBackupBucket
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "465"
          SMTP_USER: schatzieseventsadmin@gmail.com
          SMTP_PASS: !Ref SmtpPass
          VAPID_SUBJECT: mailto:schatzieseventsadmin@gmail.com
          VAPID_PUBLIC_KEY: BAVi75QDhcGZY_NeGrFiWo3PKOGSEZMNQuOF-zP-1uarQfIwGwt2EnqGosQ0WWutMMAbSrybvjqWKLlvBIQJMOo
          VAPID_PRIVATE_KEY: !Ref VapidPrivateKey
          JWT_SECRET: !Ref JwtSecret
      Tags:
        - Key: Project
          Value: Schatzies
        - Key: Env
          Value: prod
        - Key: CostCenter
          Value: schatzies-client

  # --------------------------------------------------------------
  # Lambda: Scheduled Backup Function
  # --------------------------------------------------------------
  SchatziesBackupLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: schatzies-dynamo-backup
      Runtime: nodejs24.x
      Handler: index.handler
      Role: !GetAtt SchatziesLambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import { DynamoDBClient, ScanCommand } from '@aws-sdk/client-dynamodb';
          import { S3Client, PutObjectCommand } from '@aws-sdk/client-s3';

          const dynamo = new DynamoDBClient({ region: process.env.AWS_REGION || 'ap-southeast-1' });
          const s3 = new S3Client({ region: process.env.AWS_REGION || 'ap-southeast-1' });
          const TABLE = process.env.DYNAMO_TABLE;
          const BUCKET = process.env.BACKUP_BUCKET;

          export const handler = async (event) => {
            try {
              const items = [];
              let lastKey = undefined;
              do {
                const result = await dynamo.send(new ScanCommand({
                  TableName: TABLE,
                  ExclusiveStartKey: lastKey,
                }));
                items.push(...(result.Items || []));
                lastKey = result.LastEvaluatedKey;
              } while (lastKey);

              const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
              const key = `backups/${timestamp}/full-backup.json`;

              await s3.send(new PutObjectCommand({
                Bucket: BUCKET,
                Key: key,
                Body: JSON.stringify({ timestamp: new Date().toISOString(), itemCount: items.length, items }),
                ContentType: 'application/json',
              }));

              return { statusCode: 200, body: JSON.stringify({ message: 'Backup successful', key, itemCount: items.length }) };
            } catch (err) {
              console.error('Backup failed:', err);
              return { statusCode: 500, body: JSON.stringify({ error: err.message }) };
            }
          };
      Environment:
        Variables:
          DYNAMO_TABLE: !Ref SchatziesTable
          BACKUP_BUCKET: !Ref SchatziesBackupBucket
      MemorySize: 512
      Timeout: 300
      Tags:
        - Key: Project
          Value: Schatzies
        - Key: Env
          Value: prod
        - Key: CostCenter
          Value: schatzies-client

  # --------------------------------------------------------------
  # EventBridge: Weekly Backup Schedule (Every Sunday at midnight UTC)
  # --------------------------------------------------------------
  SchatziesBackupScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: schatzies-weekly-backup
      Description: Triggers DynamoDB backup to S3 every Sunday at midnight UTC
      ScheduleExpression: "cron(0 0 ? * SUN *)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt SchatziesBackupLambda.Arn
          Id: WeeklyBackupTarget

  SchatziesBackupSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SchatziesBackupLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SchatziesBackupScheduleRule.Arn

  # --------------------------------------------------------------
  # API Gateway: HTTP API
  # --------------------------------------------------------------
  SchatziesLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SchatziesLambdaBackend
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SchatziesApi}/*/*"

  SchatziesApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: schatzies-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
      Tags:
        Project: Schatzies
        Env: prod
        CostCenter: schatzies-client

  SchatziesApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SchatziesApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SchatziesLambdaBackend.Arn}/invocations"
      PayloadFormatVersion: "2.0"

  SchatziesApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SchatziesApi
      RouteKey: "$default"
      Target: !Sub "integrations/${SchatziesApiIntegration}"

  SchatziesApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref SchatziesApi
      StageName: "$default"
      AutoDeploy: true
      Tags:
        Project: Schatzies
        Env: prod
        CostCenter: schatzies-client

  # --------------------------------------------------------------
  # IAM: Customer Managed Policy
  # --------------------------------------------------------------
  SchatziesCoreManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: SchatziesCoreAccess
      Description: Core access policy for Schatzies project resources
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetBucketLocation
              - s3:GetObject
              - dynamodb:ListTables
              - dynamodb:DescribeTable
            Resource: "*"

  # --------------------------------------------------------------
  # IAM: Users
  # --------------------------------------------------------------
  SchatziesLocalDevUser:
    Type: AWS::IAM::User
    Properties:
      UserName: schatzies-local-dev
      ManagedPolicyArns:
        - !Ref SchatziesCoreManagedPolicy
      Policies:
        - PolicyName: SchatziesLocalDevInline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3Access
                Effect: Allow
                Action:
                  - s3:*
                Resource:
                  - !Sub "${SchatziesDeploymentBucket.Arn}"
                  - !Sub "${SchatziesDeploymentBucket.Arn}/*"
                  - !Sub "${SchatziesGeneralBucket.Arn}"
                  - !Sub "${SchatziesGeneralBucket.Arn}/*"
                  - !Sub "${SchatziesBackupBucket.Arn}"
                  - !Sub "${SchatziesBackupBucket.Arn}/*"
              - Sid: DynamoDBAccess
                Effect: Allow
                Action:
                  - dynamodb:*
                Resource:
                  - !GetAtt SchatziesTable.Arn
                  - !Sub "${SchatziesTable.Arn}/index/*"
              - Sid: LambdaAccess
                Effect: Allow
                Action:
                  - lambda:*
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:schatzies-*"
              - Sid: ApiGatewayExecuteAccess
                Effect: Allow
                Action:
                  - execute-api:*
                Resource:
                  - !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SchatziesApi}/*"
              - Sid: ApiGatewayManageAccess
                Effect: Allow
                Action:
                  - apigateway:*
                Resource: "*"
              - Sid: AcmAccess
                Effect: Allow
                Action:
                  - acm:*
                Resource: "*"
              - Sid: CloudFrontAccess
                Effect: Allow
                Action:
                  - cloudfront:*
                Resource:
                  - !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SchatziesCloudFrontDistribution}"
              - Sid: CloudFormationListAccess
                Effect: Allow
                Action:
                  - cloudformation:ListStacks
                Resource: "*"
              - Sid: CloudFormationStackAccess
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:UpdateStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/schatzies-events/*"
      Tags:
        - Key: Project
          Value: Schatzies
        - Key: Env
          Value: prod
        - Key: CostCenter
          Value: schatzies-client

  SchatziesGithubActionsUser:
    Type: AWS::IAM::User
    Properties:
      UserName: schatzies-github-actions
      ManagedPolicyArns:
        - !Ref SchatziesCoreManagedPolicy
      Policies:
        - PolicyName: SchatziesGithubActionsInline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3DeployAccess
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub "${SchatziesDeploymentBucket.Arn}"
                  - !Sub "${SchatziesDeploymentBucket.Arn}/*"
              - Sid: LambdaDeployAccess
                Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:schatzies-*"
              - Sid: ApiGatewayManageAccess
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                Resource: "*"
              - Sid: AcmReadAccess
                Effect: Allow
                Action:
                  - acm:DescribeCertificate
                  - acm:ListCertificates
                Resource: "*"
              - Sid: CloudFrontDeployAccess
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                  - cloudfront:GetDistribution
                Resource:
                  - !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SchatziesCloudFrontDistribution}"
              - Sid: CloudFormationListAccess
                Effect: Allow
                Action:
                  - cloudformation:ListStacks
                Resource: "*"
              - Sid: DynamoDBSeedAccess
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource:
                  - !GetAtt SchatziesTable.Arn
              - Sid: CloudFormationStackAccess
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/schatzies-events/*"
      Tags:
        - Key: Project
          Value: Schatzies
        - Key: Env
          Value: prod
        - Key: CostCenter
          Value: schatzies-client

  # --------------------------------------------------------------
  # IAM: Admin User (full access for CLI / manual ops)
  # --------------------------------------------------------------
  SchatziesAdminUser:
    Type: AWS::IAM::User
    Properties:
      UserName: schatzies-admin
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      Tags:
        - Key: Project
          Value: Schatzies
        - Key: Env
          Value: prod
        - Key: CostCenter
          Value: schatzies-client

  SchatziesAdminAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref SchatziesAdminUser

# ==============================================================
# OUTPUTS
# ==============================================================
Outputs:

  FrontendBucketURL:
    Description: S3 Static Website URL (via Deployment Bucket)
    Value: !GetAtt SchatziesDeploymentBucket.WebsiteURL

  ApiEndpoint:
    Description: API Gateway Endpoint URL
    Value: !Sub "https://${SchatziesApi}.execute-api.${AWS::Region}.amazonaws.com"

  LambdaFunctionName:
    Description: Lambda Function Name
    Value: !Ref SchatziesLambdaBackend

  TableName:
    Description: DynamoDB Single Table Name
    Value: !Ref SchatziesTable


  DeploymentBucketName:
    Description: S3 Deployment Bucket Name (also serves Frontend)
    Value: !Ref SchatziesDeploymentBucket

  GeneralBucketName:
    Description: S3 General Purpose Bucket Name
    Value: !Ref SchatziesGeneralBucket

  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref SchatziesCloudFrontDistribution

  CloudFrontDomainName:
    Description: CloudFront Distribution Domain Name
    Value: !GetAtt SchatziesCloudFrontDistribution.DomainName

  BackupBucketName:
    Description: S3 Backup Bucket Name (Long-term archival)
    Value: !Ref SchatziesBackupBucket

  BackupLambdaFunctionName:
    Description: Backup Lambda Function Name
    Value: !Ref SchatziesBackupLambda

  AdminAccessKeyId:
    Description: Admin user Access Key ID
    Value: !Ref SchatziesAdminAccessKey

  AdminSecretAccessKey:
    Description: Admin user Secret Access Key (retrieve once, store securely)
    Value: !GetAtt SchatziesAdminAccessKey.SecretAccessKey
